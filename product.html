<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product - HaatKart</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B7A5B'/><text x='50' y='68' font-size='58' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>H</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header"></header>

<section class="page-head">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a><span>/</span><a href="shop.html" id="crumb-cat">Products</a><span>/</span><span id="crumb-now">Product</span></div>
  </div>
</section>

<main class="wrap">
  <div id="pdp"><div class="loader"><i></i></div></div>

  <!-- RELATED -->
  <section class="section" style="padding-top:10px">
    <div class="section-head">
      <div><div class="line"></div><h2>Related Products</h2></div>
      <a class="link-more" href="shop.html" id="more-link">Shob Dekhun →</a>
    </div>
    <div class="grid" id="related"></div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/data-fallback.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const P = await loadProducts();
  const id = qs('id');
  const p = P.find(x => x.id === id);
  const host = document.getElementById('pdp');

  if (!p) {
    host.innerHTML = `<div class="empty" style="margin:40px 0"><div class="ico">😕</div>
      <h3>Product-ta pawa jay nai</h3>
      <p>Hoite pare link-ta purono, ba product-ta ar nei.</p>
      <a class="btn" href="shop.html" style="margin-top:14px">← Shob product dekhun</a></div>`;
    return;
  }

  document.title = p.name + ' - HaatKart';
  document.getElementById('crumb-cat').textContent = p.cat;
  document.getElementById('crumb-cat').href = 'shop.html?cat=' + encodeURIComponent(p.cat);
  document.getElementById('crumb-now').textContent = p.name;
  document.getElementById('more-link').href = 'shop.html?cat=' + encodeURIComponent(p.cat);

  const out = p.stock <= 0;
  const off = p.old > p.price ? Math.round((1 - p.price / p.old) * 100) : 0;

  host.innerHTML = `
  <div class="pdp">
    <div class="pdp-media">${productImg(p)}</div>
    <div class="pdp-info">
      <span class="card-cat">${esc(p.cat)}${p.sub ? ' · ' + esc(p.sub) : ''}</span>
      <h1>${esc(p.name)}</h1>
      <div class="stars" style="font-size:15px">${stars(p.rating)}<span>${p.rating || 0} out of 5 · ${p.reviews || 0} reviews</span></div>
      <div class="pdp-price">
        <span class="price tk">${Number(p.price).toLocaleString('en-BD')}</span>
        ${p.old > p.price ? `<span class="old tk" style="font-size:19px">${Number(p.old).toLocaleString('en-BD')}</span>
        <span class="badge" style="position:static;margin-left:8px">${off}% OFF</span>` : ''}
      </div>
      <div class="pdp-meta">
        <span>Brand: <b style="color:var(--ink)">${esc(p.brand || 'Generic')}</b></span>
        <span>Availability: <b style="color:${out ? 'var(--danger)' : 'var(--success)'}">${out ? 'Stock-e nei' : 'In stock (' + p.stock + ')'}</b></span>
        <span>SKU: <b style="color:var(--ink)">${esc((p.id || '').toUpperCase())}</b></span>
      </div>
      <p class="pdp-desc">${esc(p.desc || '')}</p>

      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <span style="font-weight:700;color:var(--ink)">Quantity:</span>
        <div class="qty">
          <button type="button" id="q-minus" aria-label="Decrease">−</button>
          <input type="number" id="qty" value="1" min="1" max="${Math.max(1, p.stock)}" aria-label="Quantity">
          <button type="button" id="q-plus" aria-label="Increase">+</button>
        </div>
      </div>

      <div class="buy-row">
        <button class="btn btn-lg" id="btn-cart" ${out ? 'disabled' : ''}>🛒 ${out ? 'Stock-e nei' : 'Cart-e Add Korun'}</button>
        <button class="btn btn-accent btn-lg" id="btn-buy" ${out ? 'disabled' : ''}>⚡ Ekhon-i Kinun</button>
        <button class="btn btn-ghost btn-lg" data-wish="${esc(p.id)}">♡ Wishlist</button>
      </div>

      ${p.specs && Object.keys(p.specs).length ? `
      <h3 style="margin-top:8px">Specifications</h3>
      <table class="specs">
        ${Object.entries(p.specs).map(([k, v]) => `<tr><td>${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join('')}
      </table>` : ''}

      <div class="pdp-trust">
        <div><b>🚚 Free Delivery</b>৳2,000 er upore</div>
        <div><b>✅ Authentic</b>Brand warranty</div>
        <div><b>↩️ Easy Return</b>7 diner moddhe</div>
      </div>
    </div>
  </div>`;

  // qty controls
  const qi = document.getElementById('qty');
  const clamp = v => Math.max(1, Math.min(Number(v) || 1, Math.max(1, p.stock)));
  document.getElementById('q-minus').onclick = () => qi.value = clamp(Number(qi.value) - 1);
  document.getElementById('q-plus').onclick = () => qi.value = clamp(Number(qi.value) + 1);
  qi.onchange = () => qi.value = clamp(qi.value);

  // buy actions
  document.getElementById('btn-cart').onclick = () => {
    if (Cart.add(p.id, clamp(qi.value))) toast('Cart-e add holo', 'ok');
  };
  document.getElementById('btn-buy').onclick = () => {
    if (Cart.add(p.id, clamp(qi.value))) setTimeout(() => location.href = 'checkout.html', 400);
  };

  // related
  const rel = P.filter(x => x.id !== p.id && x.cat === p.cat).slice(0, 4);
  const extra = P.filter(x => x.id !== p.id && x.cat !== p.cat).slice(0, 4 - rel.length);
  document.getElementById('related').innerHTML = gridHTML([...rel, ...extra]);
  observeReveals();
});
</script>
</body>
</html>
